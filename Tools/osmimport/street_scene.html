<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Third Gear street scene</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc4e8; }
  .box { position: absolute; background: rgba(255,255,255,0.92); font: 13px sans-serif; padding: 8px 12px; }
  #panel { top: 10px; left: 10px; line-height: 22px; }
  #status { bottom: 10px; left: 10px; font-size: 12px; padding: 3px 8px; white-space: pre; }
  #legend { bottom: 10px; right: 10px; font-size: 12px; line-height: 17px; }
  #legend span { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: middle; }
  #info { top: 10px; right: 10px; max-width: 420px; max-height: 60%; overflow: auto; display: none; }
  #info table { font: 11px monospace; border-collapse: collapse; }
  #info td { padding: 0 6px 0 0; vertical-align: top; }
  #info tr.derived td { color: #06c; }
  #map2d { font: 13px sans-serif; padding: 4px 8px; cursor: pointer; margin-bottom: 4px; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="panel" class="box">
  <button id="map2d" title="Back to the 2D map at this spot">2D map</button><br>
  <label><input type="checkbox" id="showAerial" checked> aerial on the ground</label><br>
  <label><input type="checkbox" id="showStreets" checked> streets and markings</label><br>
  <label><input type="checkbox" id="showBuildings" checked> buildings</label><br>
  <label><input type="checkbox" id="showPoles" checked> signals, signs, lamps</label><br>
  <small>left drag or arrow keys: pan (loads more when you leave the area)<br>
  right drag: rotate, wheel: zoom, click: details</small>
</div>
<div id="status" class="box">building the scene…</div>
<div id="legend" class="box"></div>
<div id="info" class="box"></div>
<script type="module">
import * as THREE from "three";
import { MapControls } from "three/addons/controls/MapControls.js";

const RELOAD_DISTANCE = 250;   // metres the view centre may move from the scene centre before the scene is rebuilt
const status = document.getElementById("status");
const info = document.getElementById("info");

const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#9cc4e8");
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 20000);
const controls = new MapControls(camera, renderer.domElement);
controls.maxPolarAngle = Math.PI * 0.49;
controls.zoomToCursor = true;
controls.keyPanSpeed = 40;
controls.listenToKeyEvents(window);
scene.add(new THREE.HemisphereLight("#ffffff", "#6b6255", 1.6));
const sun = new THREE.DirectionalLight("#fff6e8", 2.2);
sun.position.set(-300, 600, 400);
scene.add(sun);

// three.js works around a fixed world origin, set by the first scene: world metres (x east, y south, z up) map to
// three.js (x, z, y) relative to it, so later scenes line up with the first.
let origin = null;
let current = null;   // { group, buildings, buildingStarts, buildingInfo, poles, centre, size, lonlat, world }
let loading = false;

function decode(base64) {
  const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
  return new Float32Array(bytes.buffer);
}

function toThree(positions) {
  const out = new Float32Array(positions.length);
  for (let i = 0; i < positions.length; i += 3) {
    out[i] = positions[i] - origin.x;
    out[i + 1] = positions[i + 2] - origin.z;
    out[i + 2] = positions[i + 1] - origin.y;
  }
  return out;
}

function triangleMesh(encoded, material) {
  if (!encoded.positions) return new THREE.Group();
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(toThree(decode(encoded.positions)), 3));
  geometry.setAttribute("color", new THREE.BufferAttribute(decode(encoded.colours), 3));
  geometry.computeVertexNormals();
  return new THREE.Mesh(geometry, material);
}

const plainGround = new THREE.MeshLambertMaterial({ color: "#8a9a6a" });
function terrainMesh(terrain) {
  const cells = terrain.cells, heights = decode(terrain.heights);
  const positions = new Float32Array((cells + 1) * (cells + 1) * 3);
  const uvs = new Float32Array((cells + 1) * (cells + 1) * 2);
  for (let row = 0; row <= cells; row++) {
    for (let column = 0; column <= cells; column++) {
      const index = row * (cells + 1) + column;
      const x = terrain.x_min + (terrain.x_max - terrain.x_min) * column / cells;
      const y = terrain.y_min + (terrain.y_max - terrain.y_min) * row / cells;
      positions.set([x - origin.x, heights[index] - origin.z, y - origin.y], index * 3);
      uvs.set([column / cells, 1 - row / cells], index * 2);
    }
  }
  const indices = [];
  for (let row = 0; row < cells; row++) {
    for (let column = 0; column < cells; column++) {
      const a = row * (cells + 1) + column, b = a + 1, c = a + cells + 1, d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute("uv", new THREE.BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  const texture = new THREE.TextureLoader().load(
    `/aerial.jpg?world=${terrain.x_min},${terrain.y_min},${terrain.x_max},${terrain.y_max}`);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const mesh = new THREE.Mesh(geometry, new THREE.MeshLambertMaterial({ map: texture }));
  mesh.userData.aerialMaterial = mesh.material;
  if (!document.getElementById("showAerial").checked) mesh.material = plainGround;
  return mesh;
}

const POLE_HEADS = {
  signal_head: { geometry: new THREE.BoxGeometry(0.35, 0.95, 0.3), color: "#202020", emissive: "#500" },
  lamp:        { geometry: new THREE.SphereGeometry(0.3, 12, 8), color: "#fff6c0", emissive: "#554400" },
  sign:        { geometry: new THREE.CylinderGeometry(0.35, 0.35, 0.04, 20).rotateX(Math.PI / 2), color: "#d01010" },
};
const poleMaterial = new THREE.MeshLambertMaterial({ color: "#7a7f86" });
function poleGroup(poles) {
  const group = new THREE.Group();
  for (const pole of poles) {
    const x = pole.x - origin.x, ground = pole.z - origin.z, z = pole.y - origin.y;
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.07, pole.height, 8), poleMaterial);
    shaft.position.set(x, ground + pole.height / 2, z);
    const head = POLE_HEADS[pole.kind];
    const headMesh = new THREE.Mesh(head.geometry,
      new THREE.MeshLambertMaterial({ color: head.color, emissive: head.emissive || "#000" }));
    headMesh.position.set(x, ground + pole.height, z);
    shaft.userData.pole = headMesh.userData.pole = pole;
    group.add(shaft, headMesh);
  }
  return group;
}

function setVisibility() {
  if (!current) return;
  current.streets.visible = document.getElementById("showStreets").checked;
  current.buildings.visible = document.getElementById("showBuildings").checked;
  current.poles.visible = document.getElementById("showPoles").checked;
  current.terrain.material = document.getElementById("showAerial").checked
    ? current.terrain.userData.aerialMaterial : plainGround;
}
for (const id of ["showAerial", "showStreets", "showBuildings", "showPoles"]) {
  document.getElementById(id).onchange = setVisibility;
}

function dispose(group) {
  group.traverse(object => {
    if (object.geometry && !Object.values(POLE_HEADS).some(head => head.geometry === object.geometry)) {
      object.geometry.dispose();
    }
    if (object.material && object.material.map) object.material.map.dispose();
  });
}

async function loadScene(query, firstLoad) {
  if (loading) return;
  loading = true;
  status.textContent = "building the scene…";
  const started = performance.now();
  try {
    const response = await fetch(`/scene.json?${query}`, { cache: "no-store" });
    if (!response.ok) {
      status.textContent = "scene build failed:\n" + await response.text();
      return;
    }
    const data = await response.json();
    const terrain = data.terrain;
    if (!origin) {
      const heights = decode(terrain.heights);
      origin = { x: (terrain.x_min + terrain.x_max) / 2, y: (terrain.y_min + terrain.y_max) / 2,
                 z: heights.reduce((a, b) => Math.min(a, b), Infinity) };
    }
    const group = new THREE.Group();
    const terrainObject = terrainMesh(terrain);
    const streets = triangleMesh(data.streets, new THREE.MeshLambertMaterial({
      vertexColors: true, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -4 }));
    const buildings = triangleMesh(data.buildings, new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }));
    const poles = poleGroup(data.poles);
    group.add(terrainObject, streets, buildings, poles);
    if (current) {
      scene.remove(current.group);
      dispose(current.group);
    }
    scene.add(group);
    const buildingStarts = [];
    let triangles = 0;
    for (const building of data.building_info) {
      buildingStarts.push(triangles);
      triangles += building.triangles;
    }
    const size = Math.max(terrain.x_max - terrain.x_min, terrain.y_max - terrain.y_min);
    current = { group, terrain: terrainObject, streets, buildings, poles, buildingStarts,
                buildingInfo: data.building_info, size, lonlat: data.lonlat_bounds, world: terrain,
                centre: new THREE.Vector3((terrain.x_min + terrain.x_max) / 2 - origin.x, 0,
                                          (terrain.y_min + terrain.y_max) / 2 - origin.y) };
    setVisibility();
    if (firstLoad) {
      camera.position.set(0, size * 0.45, size * 0.55);
      controls.target.set(0, 0, 0);
      controls.update();
      document.getElementById("legend").innerHTML = "<b>Building class</b><br>" + Object.entries(data.building_classes)
        .map(([name, colour]) => `<span style="background:${colour}"></span>${name}`).join("<br>");
    }
    status.textContent = `${Math.round(size)} m scene, ${data.building_info.length} buildings, ` +
                         `${data.poles.length} poles, built in ${((performance.now() - started) / 1000).toFixed(1)} s`;
  } finally {
    loading = false;
  }
}

// Rebuilds the scene around the view centre once it has moved far enough from the loaded scene's centre.
function followView() {
  if (!current || loading) return;
  const offset = new THREE.Vector3().subVectors(controls.target, current.centre);
  if (Math.hypot(offset.x, offset.z) < RELOAD_DISTANCE) return;
  const half = current.size / 2;
  const x = controls.target.x + origin.x, y = controls.target.z + origin.y;
  loadScene(`world=${x - half},${y - half},${x + half},${y + half}`, false);
}
controls.addEventListener("end", followView);
window.addEventListener("keyup", event => { if (event.key.startsWith("Arrow")) followView(); });

// World metres to longitude and latitude by linear interpolation over the loaded scene (accurate to well under a
// metre within a few kilometres).
function worldToLonLat(x, y) {
  const [west, south, east, north] = current.lonlat;
  const w = current.world;
  return [west + (east - west) * (x - w.x_min) / (w.x_max - w.x_min),
          north - (north - south) * (y - w.y_min) / (w.y_max - w.y_min)];
}
document.getElementById("map2d").onclick = () => {
  if (!current) { history.back(); return; }
  const half = Math.max(100, camera.position.distanceTo(controls.target) * 0.6);
  const x = controls.target.x + origin.x, y = controls.target.z + origin.y;
  const [west, north] = worldToLonLat(x - half, y - half);
  const [east, south] = worldToLonLat(x + half, y + half);
  location.href = `/?bbox=${west},${south},${east},${north}`;
};

function escapeHtml(text) {
  return String(text).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function showInfo(properties) {
  const rows = [];
  for (const [key, value] of Object.entries(properties.derived || {})) {
    rows.push(`<tr class="derived"><td>${escapeHtml(key)}</td><td>${escapeHtml(value)}</td></tr>`);
  }
  for (const key of Object.keys(properties.tags || {}).sort()) {
    rows.push(`<tr><td>${escapeHtml(key)}</td><td>${escapeHtml(properties.tags[key])}</td></tr>`);
  }
  const link = properties.osm_id
    ? ` <a href="https://www.openstreetmap.org/way/${properties.osm_id}" target="_blank">${properties.osm_id}</a>` : "";
  info.innerHTML = `<b>${escapeHtml(properties.kind)}</b>${link} <a href="#" id="closeInfo">close</a>` +
                   `<table>${rows.join("")}</table>`;
  info.style.display = "block";
  document.getElementById("closeInfo").onclick = event => { event.preventDefault(); info.style.display = "none"; };
}

// A click (not a drag) picks the building or pole under the cursor.
const raycaster = new THREE.Raycaster();
let pressedAt = null;
renderer.domElement.addEventListener("pointerdown", event => { pressedAt = [event.clientX, event.clientY]; });
renderer.domElement.addEventListener("pointerup", event => {
  if (!current || !pressedAt || Math.hypot(event.clientX - pressedAt[0], event.clientY - pressedAt[1]) > 4) return;
  const pointer = new THREE.Vector2((event.clientX / window.innerWidth) * 2 - 1, -(event.clientY / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const targets = [current.poles, current.buildings].filter(object => object.visible);
  const hit = raycaster.intersectObjects(targets, true)[0];
  if (!hit) { info.style.display = "none"; return; }
  if (hit.object.userData.pole) {
    const pole = hit.object.userData.pole;
    showInfo({ kind: `game ${pole.kind}`, derived: { what: pole.label, foot_height_m: pole.z } });
    return;
  }
  const starts = current.buildingStarts;
  let low = 0, high = starts.length - 1;
  while (low < high) {   // last building whose first triangle is at or before the hit triangle
    const middle = (low + high + 1) >> 1;
    if (starts[middle] <= hit.faceIndex) low = middle; else high = middle - 1;
  }
  showInfo(current.buildingInfo[low].properties);
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
loadScene(`bbox=${new URLSearchParams(location.search).get("bbox")}`, true);
</script>
</body>
</html>
