[/Script/EngineSettings.GameMapsSettings]
GlobalDefaultGameMode=/Script/DrivingGame.DrivingGameMode
EditorStartupMap=/Game/Maps/ProvingGround.ProvingGround
GameDefaultMap=/Game/Maps/Streamed.Streamed

[/Script/Engine.RendererSettings]
; --- Full deferred renderer: visuals are the priority (see CLAUDE.md) ---
r.ForwardShading=False
vr.InstancedStereo=True
vr.MobileMultiView=False
; Lumen GI + reflections, hardware ray tracing for sharper reflections (wet roads, windows, car paint)
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.RayTracing=True
r.Lumen.HardwareRayTracing=True
r.SkinCache.CompileShaders=True
r.GenerateMeshDistanceFields=True
; Many shadowed local lights at night (street lamps, headlights)
r.MegaLights.EnableForProject=True
r.Shadow.Virtual.Enable=1
r.Nanite.ProjectEnabled=True
; Nanite Foliage (assemblies + voxels): scanned trees from the Procedural Vegetation Editor samples
r.Nanite.Foliage=True
r.VirtualTextures=True
; TSR (temporal super resolution)
r.AntiAliasingMethod=4
; Motion blur is nauseating in VR; fixed exposure-ish behaviour is decided per level
r.DefaultFeature.MotionBlur=False
; Exposure settings (min/max brightness) are EV100 values - required for physically based lighting.
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
; SteamVR (Linux) only offers 8-bit swapchains; the default 10-bit back buffer makes UE recreate the
; OpenXR swapchain mid-frame and hang on frame 3.
r.DefaultBackBufferPixelFormat=0
r.AllowStaticLighting=False

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/Engine.PhysicsSettings]
; Vehicle physics wants small, fixed steps; tuned further in step 2
bTickPhysicsAsync=True
AsyncFixedTimeStepSize=0.002

[SystemSettings]
; VR performance (measured with Scripts/profile_gpu.sh, 5056x2704 stereo):
; TSR history at 200% (Epic scalability default) cost ~1.2 ms; 100% is enough in VR.
r.TSR.History.ScreenPercentage=100
; Stereo overflowed the default 4096-page virtual shadow map pool (missing shadows).
r.Shadow.Virtual.MaxPhysicalPages=8192

[ConsoleVariables]
; The streamed world creates and drops thousands of components; a full garbage collection pass took 34 ms on the
; game thread (Scripts/stream_test.sh). Incremental reachability spreads it over frames, 2 ms at a time.
gc.AllowIncrementalReachability=1
gc.IncrementalReachabilityTimeLimit=0.002
